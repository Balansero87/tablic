<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablić — list za pisanje</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<!-- Sve tri biblioteke leze uz aplikaciju u lib/ — nijedan CDN, radi i bez interneta.
     app.js je prevedeni app.jsx: uredi app.jsx pa pokreni `node prevedi.js`. -->
<script src="lib/tailwind.js"></script>
<script src="lib/react.js"></script>
<script src="lib/react-dom.js"></script>
<style>
  html, body { margin:0; padding:0; background:#0A0A0B; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script>
/* Servisni radnik radi samo preko http(s). Sa file:// registracija puca, pa
   se i ne pokusava — alat i dalje radi, samo bez instalacije i offline rezima. */
(function () {
  'use strict';
  if (location.protocol !== 'http:' && location.protocol !== 'https:') { return; }
  if (!navigator.serviceWorker) { return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {
      /* Neuspela registracija nije greska koju korisnik treba da vidi. */
    });
  });
}());
</script>
</body>
</html>
