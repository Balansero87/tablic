<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablić — list za pisanje</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
<style>
  html, body { margin:0; padding:0; background:#0A0A0B; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect } = React;

/* --- pohrana: localStorage umjesto Claude storage --- */
window.storage = {
  async get(k) {
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("nema kljuca");
    return { key: k, value: v };
  },
  async set(k, v) { localStorage.setItem(k, v); return { key: k, value: v }; },
};

/* --- ikone --- */
function Icon({ size = 18, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "block" }}>{children}</svg>
  );
}
const Undo2 = (p) => <Icon {...p}><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></Icon>;
const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
const Minus = (p) => <Icon {...p}><path d="M5 12h14"/></Icon>;
const Trophy = (p) => <Icon {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
const Palette = (p) => <Icon {...p}><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2a10 10 0 0 0 0 20 2 2 0 0 0 2-2v-1a2 2 0 0 1 2-2h2a4 4 0 0 0 4-4 10 10 0 0 0-10-10Z"/></Icon>;


/* ---------- teme ---------- */
const THEMES = {
  tabla: { name: "Tabla", paper: "#0A0A0B", paper2: "#141416", bone: "#EDE6DA" },
  papir: { name: "Papir", paper: "#F3EEE4", paper2: "#FFFFFF", bone: "#221F1B" },
  filc: { name: "Filc", paper: "#0D3527", paper2: "#123F2F", bone: "#EFE7D7" },
  noc: { name: "Noć", paper: "#0B1020", paper2: "#151B2E", bone: "#E3E8F5" },
};

const INKS = [
  { id: "crvena", hex: "#D93A2B" },
  { id: "zlatna", hex: "#C9A227" },
  { id: "plava", hex: "#4A87F7" },
  { id: "zelena", hex: "#2FA86B" },
  { id: "ljubicasta", hex: "#A163E8" },
];

const FONTS = {
  novine: {
    name: "Novine",
    display: "'Oswald', 'Arial Narrow', sans-serif",
    body: "'IBM Plex Sans', system-ui, sans-serif",
    mono: "'IBM Plex Mono', ui-monospace, monospace",
    track: "0.14em",
  },
  rukopis: {
    name: "Rukopis",
    display: "'Caveat', cursive",
    body: "'Caveat', cursive",
    mono: "'Caveat', cursive",
    track: "0.01em",
  },
  klasika: {
    name: "Klasika",
    display: "'Playfair Display', Georgia, serif",
    body: "'Lora', Georgia, serif",
    mono: "'Lora', Georgia, serif",
    track: "0.05em",
  },
  blok: {
    name: "Blok",
    display: "'Space Grotesk', system-ui, sans-serif",
    body: "'Space Grotesk', system-ui, sans-serif",
    mono: "'Space Mono', ui-monospace, monospace",
    track: "0.03em",
  },
};

/* CSS varijable */
const PAPER = "var(--paper)";
const PAPER_2 = "var(--paper2)";
const INK = "var(--ink)";
const INK_DIM = "var(--ink-dim)";
const INK_SOFT = "var(--ink-soft)";
const BONE = "var(--bone)";
const MUTED = "var(--muted)";
const FAINT = "var(--faint)";
const SURFACE = "var(--surface)";
const display = "var(--f-display)";
const body = "var(--f-body)";
const mono = "var(--f-mono)";
const TRACK = "var(--track)";

const hexA = (hex, a) => {
  const h = hex.replace("#", "");
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};

/* ---------- pravila ----------
   štih (10 J Q K A) = 1 · 10♦ = 2 · 2♣ = 1 · 3 na karte = 3  →  25
   pat 26:26  →  22 · tabla = 1
--------------------------------- */
const POOL_FULL = 25;
const POOL_PAT = 22;
const KEY_GAME = "tablic:list:v4";
const KEY_LOOK = "tablic:izgled:v1";

/* ---------- crtice ---------- */
function TallyGroup({ count, size }) {
  const full = count === 5;
  const strokes = Math.min(4, count);
  const vw = full ? 38 : 7 * strokes + 4;
  return (
    <svg
      viewBox={`0 0 ${vw} 32`}
      style={{
        height: size,
        width: (size * vw) / 32,
        display: "block",
        overflow: "visible",
        stroke: INK,
        fill: "none",
        strokeWidth: 2.1,
        strokeLinecap: "round",
      }}
    >
      {Array.from({ length: strokes }).map((_, i) => {
        const x = 5 + 7 * i;
        const b = i % 2 ? 0.9 : -0.9;
        return <path key={i} d={`M${x + b * 0.4} 3 C${x - b} 11, ${x + b} 21, ${x - b * 0.5} 29`} />;
      })}
      {full && <path d="M0.5 28.5 C9 24, 20 15, 37 3.5" />}
    </svg>
  );
}

function Tally({ n, size = 24 }) {
  if (!n) return null;
  const groups = [];
  let left = n;
  while (left > 0) {
    groups.push(Math.min(5, left));
    left -= 5;
  }
  return (
    <div className="flex flex-wrap items-end" style={{ gap: size * 0.42, rowGap: size * 0.3 }}>
      {groups.map((g, i) => (
        <TallyGroup key={i} count={g} size={size} />
      ))}
    </div>
  );
}

/* ---------- linije ---------- */
function InkLineV() {
  return (
    <svg
      viewBox="0 0 12 100"
      preserveAspectRatio="none"
      className="absolute inset-y-0 pointer-events-none"
      style={{ width: 12, marginLeft: -6, stroke: INK, fill: "none", strokeLinecap: "round" }}
    >
      <path
        d="M6.4 0 C 5.1 12, 7.2 21, 5.8 33 C 4.6 44, 7.4 55, 6.1 67 C 5.0 78, 7.0 88, 5.7 100"
        strokeWidth="1.2"
        vectorEffect="non-scaling-stroke"
      />
    </svg>
  );
}

function InkLineH({ strong }) {
  return (
    <svg
      viewBox="0 0 400 6"
      preserveAspectRatio="none"
      className="w-full"
      style={{ height: strong ? 6 : 4, stroke: INK, fill: "none", strokeLinecap: "round" }}
    >
      <path
        d="M2 3.6 C 60 1.8, 120 4.4, 190 2.6 C 260 1.2, 330 4.2, 398 2.8"
        strokeWidth={strong ? 2.2 : 1.2}
        vectorEffect="non-scaling-stroke"
      />
    </svg>
  );
}

function TablicList() {
  const [phase, setPhase] = useState("setup");
  const [mode, setMode] = useState("2");
  const [names, setNames] = useState(["Igrač 1", "Igrač 2", "Igrač 3", "Igrač 4"]);
  const [teamNames, setTeamNames] = useState(["Mi", "Vi"]);
  const [target, setTarget] = useState(101);
  const [entities, setEntities] = useState([]);
  const [rounds, setRounds] = useState([]);
  const [tables, setTables] = useState({});
  const [dialog, setDialog] = useState(false);
  const [look, setLook] = useState(false);
  const [stih, setStih] = useState({});
  const [touched, setTouched] = useState([]);
  const [pat, setPat] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const [theme, setTheme] = useState("tabla");
  const [font, setFont] = useState("novine");
  const [ink, setInk] = useState(INKS[0].hex);

  /* ---------- snimanje ---------- */
  useEffect(() => {
    (async () => {
      try {
        const l = await window.storage.get(KEY_LOOK);
        if (l?.value) {
          const s = JSON.parse(l.value);
          if (THEMES[s.theme]) setTheme(s.theme);
          if (FONTS[s.font]) setFont(s.font);
          if (s.ink) setInk(s.ink);
        }
      } catch (e) {}
      try {
        const r = await window.storage.get(KEY_GAME);
        if (r?.value) {
          const s = JSON.parse(r.value);
          if (s.phase === "game" && s.entities?.length) {
            setPhase("game");
            setEntities(s.entities);
            setRounds(s.rounds || []);
            setTables(s.tables || {});
            setTarget(s.target || 101);
          }
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(KEY_GAME, JSON.stringify({ phase, entities, rounds, tables, target }));
      } catch (e) {}
    })();
  }, [phase, entities, rounds, tables, target, loaded]);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(KEY_LOOK, JSON.stringify({ theme, font, ink }));
      } catch (e) {}
    })();
  }, [theme, font, ink, loaded]);

  /* ---------- izračun ---------- */
  const stihTotal = (id) => rounds.reduce((s, r) => s + (r.points[id] || 0), 0);
  const tableTotal = (id) => rounds.reduce((s, r) => s + (r.tables[id] || 0), 0) + (tables[id] || 0);
  const total = (id) => stihTotal(id) + tableTotal(id);
  const leader = entities.length ? Math.max(...entities.map((e) => total(e.id))) : 0;
  const winner =
    leader >= target && entities.filter((e) => total(e.id) === leader).length === 1
      ? entities.find((e) => total(e.id) === leader)
      : null;

  /* ---------- akcije ---------- */
  const start = () => {
    const ents =
      mode === "teams"
        ? teamNames.map((n, i) => ({ id: "t" + i, name: n.trim() || `Ekipa ${i + 1}` }))
        : names.slice(0, parseInt(mode, 10)).map((n, i) => ({ id: "p" + i, name: n.trim() || `Igrač ${i + 1}` }));
    setEntities(ents);
    setRounds([]);
    setTables(Object.fromEntries(ents.map((e) => [e.id, 0])));
    setPhase("game");
  };

  const addTable = (id, d = 1) => setTables((t) => ({ ...t, [id]: Math.max(0, (t[id] || 0) + d) }));

  const openDialog = () => {
    setStih(Object.fromEntries(entities.map((e) => [e.id, ""])));
    setTouched([]);
    setPat(false);
    setDialog(true);
  };

  const untouched = entities.filter((e) => !touched.includes(e.id));
  const enteredSum = entities.reduce(
    (s, e) => (touched.includes(e.id) ? s + (parseInt(stih[e.id], 10) || 0) : s),
    0
  );
  const pool = pat ? POOL_PAT : POOL_FULL;
  const remainder = pool - enteredSum;
  const isAuto = (id) => !touched.includes(id) && untouched.length === 1;
  const roundPoints = (id) => {
    if (touched.includes(id)) return parseInt(stih[id], 10) || 0;
    if (isAuto(id)) return Math.max(0, remainder);
    return 0;
  };

  const setStihValue = (id, v) => {
    setStih((p) => ({ ...p, [id]: v }));
    setTouched((t) => (v === "" ? t.filter((x) => x !== id) : t.includes(id) ? t : [...t, id]));
  };

  const commit = () => {
    const points = Object.fromEntries(entities.map((e) => [e.id, roundPoints(e.id)]));
    setRounds((r) => [...r, { points, tables: { ...tables } }]);
    setTables(Object.fromEntries(entities.map((e) => [e.id, 0])));
    setDialog(false);
  };

  const undoRound = () => setRounds((r) => r.slice(0, -1));
  const reset = () => {
    setPhase("setup");
    setRounds([]);
    setTables({});
    setEntities([]);
  };

  const shell = { theme, font, ink };

  /* ---------- izbornik izgleda ---------- */
  const LookPanel = () =>
    !look ? null : (
      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(0,0,0,0.72)" }}>
        <div className="w-full max-w-md max-h-[92vh] overflow-y-auto" style={{ background: PAPER_2, border: `1px solid ${FAINT}`, borderRadius: 3 }}>
          <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: `1px solid ${FAINT}` }}>
            <div style={{ fontFamily: display, fontSize: 19, color: BONE, letterSpacing: TRACK }}>IZGLED</div>
            <button onClick={() => setLook(false)} style={{ color: BONE }}>
              <X size={20} />
            </button>
          </div>

          <div className="px-5 py-5">
            <Label>Pozadina</Label>
            <div className="grid grid-cols-4 gap-2 mt-3">
              {Object.entries(THEMES).map(([id, t]) => (
                <button
                  key={id}
                  onClick={() => setTheme(id)}
                  className="py-3 flex flex-col items-center gap-2"
                  style={{
                    background: SURFACE,
                    border: `1px solid ${theme === id ? INK : FAINT}`,
                    borderRadius: 2,
                  }}
                >
                  <span
                    style={{
                      width: 26,
                      height: 26,
                      borderRadius: 2,
                      background: t.paper,
                      border: `1px solid ${FAINT}`,
                      display: "block",
                    }}
                  />
                  <span style={{ fontFamily: body, fontSize: 11, color: theme === id ? BONE : MUTED }}>{t.name}</span>
                </button>
              ))}
            </div>

            <div className="mt-6">
              <Label>Slova</Label>
              <div className="grid grid-cols-2 gap-2 mt-3">
                {Object.entries(FONTS).map(([id, f]) => (
                  <button
                    key={id}
                    onClick={() => setFont(id)}
                    className="py-3 px-3 text-left"
                    style={{
                      background: SURFACE,
                      border: `1px solid ${font === id ? INK : FAINT}`,
                      borderRadius: 2,
                      color: BONE,
                    }}
                  >
                    <div style={{ fontFamily: f.display, fontSize: 20, letterSpacing: f.track }}>TABLIĆ</div>
                    <div style={{ fontFamily: f.mono, fontSize: 13, color: MUTED, marginTop: 2 }}>25 · 101</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="mt-6">
              <Label>Boja mastila</Label>
              <div className="flex gap-2.5 mt-3">
                {INKS.map((c) => (
                  <button
                    key={c.id}
                    onClick={() => setInk(c.hex)}
                    aria-label={c.id}
                    style={{
                      width: 40,
                      height: 40,
                      borderRadius: 999,
                      background: c.hex,
                      border: ink === c.hex ? `2px solid ${BONE}` : `1px solid ${FAINT}`,
                      outline: ink === c.hex ? `2px solid ${c.hex}` : "none",
                      outlineOffset: 2,
                    }}
                  />
                ))}
              </div>
            </div>

            <div className="mt-7 px-4 py-4" style={{ background: PAPER, borderRadius: 2, border: `1px solid ${FAINT}` }}>
              <div className="flex items-center justify-between">
                <Tally n={7} size={22} />
                <span style={{ fontFamily: mono, fontSize: 26, color: INK }}>17</span>
              </div>
            </div>

            <button
              onClick={() => setLook(false)}
              className="w-full mt-5 py-3.5"
              style={{ background: BONE, color: PAPER, fontFamily: display, fontSize: 17, letterSpacing: TRACK, borderRadius: 2 }}
            >
              GOTOVO
            </button>
          </div>
        </div>
      </div>
    );

  /* ---------- SETUP ---------- */
  if (phase === "setup") {
    const count = mode === "teams" ? 2 : parseInt(mode, 10);
    return (
      <Shell {...shell}>
        <div className="w-full max-w-md mx-auto px-5 py-10">
          <div className="flex items-start justify-between">
            <Header />
            <IconBtn onClick={() => setLook(true)} title="Izgled">
              <Palette size={16} />
            </IconBtn>
          </div>

          <div className="mt-9">
            <Label>Ko igra</Label>
            <div className="grid grid-cols-4 gap-2 mt-3">
              {[["2", "2"], ["3", "3"], ["4", "4"], ["teams", "2×2"]].map(([v, l]) => (
                <Choice key={v} on={mode === v} onClick={() => setMode(v)}>
                  {l}
                </Choice>
              ))}
            </div>
          </div>

          <div className="mt-7">
            <Label>{mode === "teams" ? "Imena ekipa" : "Imena"}</Label>
            <div className="mt-3 space-y-2">
              {Array.from({ length: count }).map((_, i) => (
                <input
                  key={i}
                  value={mode === "teams" ? teamNames[i] : names[i]}
                  onChange={(e) => {
                    const v = e.target.value;
                    if (mode === "teams") setTeamNames((n) => n.map((x, j) => (j === i ? v : x)));
                    else setNames((n) => n.map((x, j) => (j === i ? v : x)));
                  }}
                  className="w-full px-4 py-3 outline-none"
                  style={{
                    background: PAPER_2,
                    color: BONE,
                    border: `1px solid ${FAINT}`,
                    borderRadius: 2,
                    fontFamily: body,
                    fontSize: 16,
                  }}
                />
              ))}
            </div>
          </div>

          <div className="mt-7">
            <Label>Do koliko</Label>
            <div className="grid grid-cols-3 gap-2 mt-3">
              {[101, 151, 201].map((t) => (
                <Choice key={t} on={target === t} onClick={() => setTarget(t)} num>
                  {t}
                </Choice>
              ))}
            </div>
          </div>

          <button
            onClick={start}
            className="w-full mt-10 py-4 active:scale-[0.99] transition-transform"
            style={{ background: BONE, color: PAPER, fontFamily: display, fontSize: 20, letterSpacing: TRACK, borderRadius: 2 }}
          >
            OTVORI LIST
          </button>

          <p className="mt-7" style={{ fontFamily: mono, fontSize: 12, lineHeight: 1.8, color: MUTED }}>
            ŠTIH (10 J Q K A) = 1 · 10♦ = 2 · 2♣ = 1 · 3 NA KARTE = 3
            <br />PARTIJA 25 · PAT 22 · TABLA 1
          </p>
        </div>
        <LookPanel />
      </Shell>
    );
  }

  /* ---------- LIST ---------- */
  const n = entities.length;
  const big = n <= 2;

  return (
    <Shell {...shell}>
      <div className="w-full max-w-md mx-auto px-4 py-6 pb-32">
        <div className="flex items-start justify-between mb-6">
          <Header small />
          <div className="flex gap-1">
            <IconBtn onClick={() => setLook(true)} title="Izgled">
              <Palette size={16} />
            </IconBtn>
            <IconBtn onClick={undoRound} disabled={!rounds.length} title="Obriši zadnju partiju">
              <Undo2 size={16} />
            </IconBtn>
            <IconBtn onClick={reset} title="Novi list">
              <RotateCcw size={16} />
            </IconBtn>
          </div>
        </div>

        {winner && (
          <div className="mb-5 px-4 py-4 flex items-center gap-3" style={{ background: INK, color: "#fff", borderRadius: 2 }}>
            <Trophy size={22} />
            <div>
              <div style={{ fontFamily: display, fontSize: 22, letterSpacing: TRACK }}>{winner.name.toUpperCase()}</div>
              <div style={{ fontFamily: body, fontSize: 14 }}>{total(winner.id)} bodova</div>
            </div>
          </div>
        )}

        <div className="relative">
          <div className="grid" style={{ gridTemplateColumns: `repeat(${n}, 1fr)` }}>
            {entities.map((e) => (
              <div
                key={e.id}
                className="px-2 pb-2 text-center truncate"
                style={{ fontFamily: display, fontSize: big ? 21 : 15, letterSpacing: TRACK, color: BONE }}
              >
                {e.name.toUpperCase()}
              </div>
            ))}
          </div>
          <InkLineH strong />

          <div className="relative">
            {Array.from({ length: n - 1 }).map((_, i) => (
              <div key={i} className="absolute inset-y-0" style={{ left: `${((i + 1) / n) * 100}%` }}>
                <InkLineV />
              </div>
            ))}

            {rounds.map((r, ri) => (
              <div key={ri} className="grid items-center" style={{ gridTemplateColumns: `repeat(${n}, 1fr)`, minHeight: 46 }}>
                {entities.map((e) => (
                  <div key={e.id} className="flex items-center justify-between gap-2 px-3 py-2">
                    <Tally n={r.tables[e.id] || 0} size={big ? 20 : 15} />
                    <span style={{ fontFamily: mono, fontSize: big ? 25 : 18, color: INK, marginLeft: "auto" }}>
                      {r.points[e.id] || 0}
                    </span>
                  </div>
                ))}
              </div>
            ))}

            <div
              className="grid items-center"
              style={{ gridTemplateColumns: `repeat(${n}, 1fr)`, minHeight: 58, background: INK_SOFT }}
            >
              {entities.map((e) => (
                <div
                  key={e.id}
                  onClick={() => addTable(e.id, 1)}
                  className="flex items-center justify-between gap-2 px-3 py-3 cursor-pointer select-none active:scale-[0.98] transition-transform"
                >
                  <Tally n={tables[e.id] || 0} size={big ? 20 : 15} />
                  {tables[e.id] ? (
                    <button
                      onClick={(ev) => {
                        ev.stopPropagation();
                        addTable(e.id, -1);
                      }}
                      className="p-1.5 shrink-0"
                      style={{ background: SURFACE, color: BONE, borderRadius: 2, marginLeft: "auto" }}
                    >
                      <Minus size={13} />
                    </button>
                  ) : (
                    <span style={{ fontFamily: mono, fontSize: big ? 22 : 17, color: INK_DIM, marginLeft: "auto" }}>+</span>
                  )}
                </div>
              ))}
            </div>

            <div style={{ borderTop: `1px dashed ${FAINT}` }} />
            <div className="grid items-center" style={{ gridTemplateColumns: `repeat(${n}, 1fr)`, minHeight: 46 }}>
              {entities.map((e) => (
                <div key={e.id} className="flex items-center justify-between gap-2 px-3 py-2">
                  <span style={{ fontFamily: mono, fontSize: 11, letterSpacing: "0.1em", color: MUTED }}>TABLE</span>
                  <span style={{ fontFamily: mono, fontSize: big ? 25 : 18, color: INK, marginLeft: "auto" }}>
                    {tableTotal(e.id)}
                  </span>
                </div>
              ))}
            </div>
          </div>

          <InkLineH strong />

          <div className="grid" style={{ gridTemplateColumns: `repeat(${n}, 1fr)` }}>
            {entities.map((e) => {
              const t = total(e.id);
              const lead = t === leader && leader > 0;
              return (
                <div key={e.id} className="px-3 pt-3 text-right">
                  <div style={{ fontFamily: mono, fontSize: big ? 40 : 28, color: lead ? INK : BONE, lineHeight: 1 }}>{t}</div>
                  <div style={{ fontFamily: mono, fontSize: 11, color: MUTED, letterSpacing: "0.06em", marginTop: 5 }}>
                    {stihTotal(e.id)} + {tableTotal(e.id)}T
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <p className="mt-6 text-center" style={{ fontFamily: body, fontSize: 13, color: MUTED }}>
          Tapni u zadnji red da upišeš tablu · partija {rounds.length + 1}
          {rounds.length < 6 ? " od 6" : ""}
        </p>
      </div>

      <div className="fixed bottom-0 left-0 right-0 px-4 py-4" style={{ background: `linear-gradient(to top, ${PAPER} 62%, transparent)` }}>
        <button
          onClick={openDialog}
          className="w-full max-w-md mx-auto block py-4 active:scale-[0.99] transition-transform"
          style={{ background: BONE, color: PAPER, fontFamily: display, fontSize: 18, letterSpacing: TRACK, borderRadius: 2 }}
        >
          UPIŠI PARTIJU
        </button>
      </div>

      {/* ---------- dijalog ---------- */}
      {dialog && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(0,0,0,0.72)" }}>
          <div className="w-full max-w-md max-h-[92vh] overflow-y-auto" style={{ background: PAPER_2, border: `1px solid ${FAINT}`, borderRadius: 3 }}>
            <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: `1px solid ${FAINT}` }}>
              <div style={{ fontFamily: display, fontSize: 19, color: BONE, letterSpacing: TRACK }}>
                PARTIJA {rounds.length + 1}
              </div>
              <button onClick={() => setDialog(false)} style={{ color: BONE }}>
                <X size={20} />
              </button>
            </div>

            <div className="px-5 py-5">
              <div className="flex items-center justify-between">
                <Label>Bodovi · ukupno {pool}</Label>
                <button
                  onClick={() => setPat((p) => !p)}
                  className="px-3 py-1.5"
                  style={{
                    fontFamily: mono,
                    fontSize: 13,
                    letterSpacing: "0.08em",
                    background: pat ? INK : SURFACE,
                    color: pat ? "#fff" : MUTED,
                    border: `1px solid ${pat ? INK : FAINT}`,
                    borderRadius: 2,
                  }}
                >
                  PAT
                </button>
              </div>

              <div className="mt-3 space-y-3">
                {entities.map((e) => {
                  const auto = isAuto(e.id);
                  return (
                    <div key={e.id} className="flex items-center justify-between gap-3">
                      <span style={{ fontFamily: display, fontSize: 18, color: BONE, letterSpacing: TRACK }}>
                        {e.name.toUpperCase()}
                      </span>
                      <div className="flex items-center gap-2">
                        {auto && <span style={{ fontFamily: mono, fontSize: 11, color: INK, letterSpacing: "0.08em" }}>AUTO</span>}
                        <input
                          type="number"
                          inputMode="numeric"
                          placeholder="—"
                          value={touched.includes(e.id) ? stih[e.id] : auto ? String(Math.max(0, remainder)) : ""}
                          onChange={(ev) => setStihValue(e.id, ev.target.value)}
                          className="w-24 px-3 py-2 text-right outline-none"
                          style={{
                            background: PAPER,
                            color: auto ? INK : BONE,
                            border: `1px solid ${auto ? INK_DIM : FAINT}`,
                            borderRadius: 2,
                            fontFamily: mono,
                            fontSize: 18,
                          }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>

              <p className="mt-3" style={{ fontFamily: mono, fontSize: 12, color: MUTED, letterSpacing: "0.04em" }}>
                {pat ? "PAT 26:26 · TRI NA KARTE NE IDU NIKOME" : "UKLJUČUJE TRI NA KARTE"}
              </p>
              {remainder < 0 && untouched.length <= 1 && (
                <p className="mt-1" style={{ fontFamily: mono, fontSize: 12, color: INK }}>
                  PREKORAČENO ZA {-remainder}
                </p>
              )}

              <div className="mt-6 pt-4 space-y-2" style={{ borderTop: `1px solid ${FAINT}` }}>
                {entities.map((e) => (
                  <div key={e.id} className="flex justify-between items-baseline" style={{ fontFamily: mono, fontSize: 14, color: BONE }}>
                    <span>{e.name}</span>
                    <span>
                      <span style={{ color: MUTED }}>
                        {stihTotal(e.id)} + {roundPoints(e.id)} + {tableTotal(e.id)}T{" = "}
                      </span>
                      <span style={{ fontSize: 18, color: INK }}>{total(e.id) + roundPoints(e.id)}</span>
                    </span>
                  </div>
                ))}
              </div>

              <button
                onClick={commit}
                className="w-full mt-5 py-3.5 flex items-center justify-center gap-2"
                style={{ background: BONE, color: PAPER, fontFamily: display, fontSize: 17, letterSpacing: TRACK, borderRadius: 2 }}
              >
                <Check size={17} /> UPIŠI
              </button>
            </div>
          </div>
        </div>
      )}

      <LookPanel />
    </Shell>
  );
}

/* ---------- omotači ---------- */
function Shell({ children, theme, font, ink }) {
  const t = THEMES[theme] || THEMES.tabla;
  const f = FONTS[font] || FONTS.novine;
  const b = t.bone;
  return (
    <div
      className="min-h-screen w-full"
      style={{
        "--paper": t.paper,
        "--paper2": t.paper2,
        "--bone": b,
        "--muted": hexA(b, 0.5),
        "--faint": hexA(b, 0.16),
        "--surface": hexA(b, 0.06),
        "--ink": ink,
        "--ink-dim": hexA(ink, 0.45),
        "--ink-soft": hexA(ink, 0.07),
        "--f-display": f.display,
        "--f-body": f.body,
        "--f-mono": f.mono,
        "--track": f.track,
        background: PAPER,
        fontFamily: body,
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&family=Playfair+Display:wght@500;700&family=Lora:wght@400;600&family=Space+Grotesk:wght@400;600&family=Space+Mono:wght@400;700&display=swap');
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      `}</style>
      {children}
    </div>
  );
}

function Header({ small }) {
  return (
    <div>
      <h1 style={{ fontFamily: display, fontSize: small ? 26 : 44, letterSpacing: TRACK, color: BONE, lineHeight: 1 }}>
        TABLIĆ
      </h1>
      {!small && (
        <p style={{ fontFamily: mono, fontSize: 12, letterSpacing: "0.2em", color: INK, marginTop: 9 }}>LIST ZA PISANJE</p>
      )}
    </div>
  );
}

function Label({ children }) {
  return (
    <div style={{ fontFamily: mono, fontSize: 11, letterSpacing: "0.16em", color: MUTED }}>
      {children.toString().toUpperCase()}
    </div>
  );
}

function Choice({ children, on, onClick, num, pad }) {
  return (
    <button
      onClick={onClick}
      className={pad ? "px-4 py-2" : "py-3"}
      style={{
        fontFamily: num ? mono : display,
        fontSize: num ? 16 : 18,
        letterSpacing: TRACK,
        background: on ? INK : SURFACE,
        color: on ? "#fff" : MUTED,
        border: `1px solid ${on ? INK : FAINT}`,
        borderRadius: 2,
      }}
    >
      {children}
    </button>
  );
}

function IconBtn({ children, onClick, disabled, title }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      title={title}
      className="p-2.5 disabled:opacity-25"
      style={{ background: SURFACE, color: BONE, border: `1px solid ${FAINT}`, borderRadius: 2 }}
    >
      {children}
    </button>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<TablicList />);

</script>
</body>
</html>
